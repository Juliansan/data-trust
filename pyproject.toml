[project]
name = "data-trust"
version = "0.0.1"
description = "A project to manage data trust and integrity."
readme = "README.md"
authors = [{ name = "julian", email = "julsanm@gmail.com" }]
requires-python = ">=3.13"
dependencies = ["typer>=0.26.7"]

[project.scripts]
data-trust = "data_trust.entrypoints.cli:app"

[build-system]
requires = ["uv_build>=0.11.24,<0.12.0"]
build-backend = "uv_build"


[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
# A pragmatic strict-ish selection.
select = [
    "E",
    "W",   # pycodestyle
    "F",   # pyflakes
    "I",   # isort (import sorting)
    "N",   # pep8-naming
    "UP",  # pyupgrade (modernize syntax)
    "B",   # flake8-bugbear (likely bugs)
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
]
ignore = ["E501"] # line length handled by the formatter


[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = ["mypy>=2.1.0", "pre-commit>=4.6.0", "pytest>=9.1.1", "ruff>=0.15.19"]
