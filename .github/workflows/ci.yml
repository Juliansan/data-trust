name: CI_DATA_TRUST_WORKFLOW

on:
  push:
    branches: [main]
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --group dev
      - name: Lint
        run: uv run ruff check .
      - name: Format Check
        run: uv run ruff format --check .
      - name: Type Check
        run: uv run mypy
      - name: Run Tests
        run: uv run pytest
